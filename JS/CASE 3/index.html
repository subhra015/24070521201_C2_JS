<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Eligibility Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #f39c12, #e74c3c, #9b59b6, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: #ddd;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 1.2rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #f39c12;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.3);
        }

        input[type="number"]::placeholder {
            color: #666;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #f39c12, #e74c3c);
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(243, 156, 18, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .result.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Scholarship category colors */
        .not-eligible {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }

        .bronze {
            background: rgba(205, 127, 50, 0.2);
            border: 1px solid #cd7f32;
            color: #cd7f32;
        }

        .silver {
            background: rgba(192, 192, 192, 0.2);
            border: 1px solid #c0c0c0;
            color: #c0c0c0;
        }

        .gold {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            color: #ffd700;
        }

        .platinum {
            background: rgba(229, 228, 226, 0.2);
            border: 1px solid #e5e4e2;
            color: #e5e4e2;
            text-shadow: 0 0 10px rgba(229, 228, 226, 0.5);
        }

        .error {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }

        .criteria {
            margin-top: 30px;
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 12px;
        }

        .criteria h3 {
            margin-bottom: 15px;
            color: #f39c12;
            text-align: center;
        }

        .criteria ul {
            list-style: none;
        }

        .criteria li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
        }

        .criteria li:last-child {
            border-bottom: none;
        }

        .badge {
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .badge-not { background: #e74c3c; color: #fff; }
        .badge-bronze { background: #cd7f32; color: #fff; }
        .badge-silver { background: #c0c0c0; color: #333; }
        .badge-gold { background: #ffd700; color: #333; }
        .badge-platinum { background: #e5e4e2; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Scholarship Eligibility</h1>
        <p class="subtitle">Enter your marks to check your scholarship category</p>

        <div class="input-group">
            <label for="marks">Student Marks (0 - 100)</label>
            <input 
                type="number" 
                id="marks" 
                min="0" 
                max="100" 
                placeholder="Enter marks here..."
                onkeypress="if(event.key === 'Enter') checkEligibility()"
            >
        </div>

        <button onclick="checkEligibility()">Check Eligibility</button>

        <div id="result" class="result"></div>

        <div class="criteria">
            <h3>📋 Scholarship Criteria</h3>
            <ul>
                <li><span>Below 50</span> <span class="badge badge-not">Not Eligible</span></li>
                <li><span>50 – 69</span> <span class="badge badge-bronze">Bronze</span></li>
                <li><span>70 – 84</span> <span class="badge badge-silver">Silver</span></li>
                <li><span>85 – 94</span> <span class="badge badge-gold">Gold</span></li>
                <li><span>95 – 100</span> <span class="badge badge-platinum">Platinum</span></li>
            </ul>
        </div>
    </div>

    <script>
        function checkEligibility() {
            const marksInput = document.getElementById('marks');
            const resultDiv = document.getElementById('result');
            const marks = parseFloat(marksInput.value);

            // Reset result
            resultDiv.className = 'result';

            // Validation
            if (isNaN(marks) || marksInput.value === '') {
                resultDiv.textContent = '⚠️ Please enter a valid number!';
                resultDiv.classList.add('error', 'show');
                return;
            }

            if (marks < 0 || marks > 100) {
                resultDiv.textContent = '⚠️ Marks must be between 0 and 100!';
                resultDiv.classList.add('error', 'show');
                return;
            }

            // Determine scholarship category
            let category = '';
            let className = '';

            if (marks < 50) {
                category = '❌ Not Eligible for Scholarship';
                className = 'not-eligible';
            } else if (marks >= 50 && marks <= 69) {
                category = '🥉 Bronze Scholarship';
                className = 'bronze';
            } else if (marks >= 70 && marks <= 84) {
                category = '🥈 Silver Scholarship';
                className = 'silver';
            } else if (marks >= 85 && marks <= 94) {
                category = '🥇 Gold Scholarship';
                className = 'gold';
            } else if (marks >= 95 && marks <= 100) {
                category = '💎 Platinum Scholarship';
                className = 'platinum';
            }

            // Display result with animation
            resultDiv.textContent = category;
            resultDiv.classList.add(className, 'show');
        }
    </script>
</body>
</html>
