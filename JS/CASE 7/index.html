<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinic Task Manager</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🏥</span>
                    <h1>Clinic Task Manager</h1>
                </div>
                <p class="header-sub">Manage daily patient appointments &amp; tasks</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Add Task Section -->
            <section class="add-task-section">
                <div class="card">
                    <h2>📋 Add New Task</h2>
                    <form id="taskForm" class="task-form">
                        <div class="form-group">
                            <input
                                type="text"
                                id="taskInput"
                                placeholder="e.g. Call Mr. Rahul to confirm appointment"
                                required
                                autofocus
                            />
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="addBtn">
                                ➕ Add Task
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Task List Section -->
            <section class="task-list-section">
                <div class="card">
                    <div class="list-header">
                        <h2>📌 Tasks</h2>
                        <div class="filter-controls">
                            <button class="filter-btn active" data-filter="all">All</button>
                            <button class="filter-btn" data-filter="active">Active</button>
                            <button class="filter-btn" data-filter="completed">Completed</button>
                        </div>
                        <span class="task-count" id="taskCount">0 tasks</span>
                    </div>

                    <!-- Task List -->
                    <ul id="taskList" class="task-list">
                        <!-- Tasks will be rendered here by JavaScript -->
                    </ul>

                    <!-- Empty State -->
                    <div id="emptyState" class="empty-state">
                        <p>✨ No tasks yet. Add your first task above!</p>
                    </div>
                </div>
            </section>

        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>&copy; 2026 Clinic Task Manager &mdash; Built with ❤️ for better patient care</p>
        </footer>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ Edit Task</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <form id="editForm" class="modal-body">
                <div class="form-group">
                    <input
                        type="text"
                        id="editInput"
                        placeholder="Update task description"
                        required
                    />
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveEditBtn">💾 Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
