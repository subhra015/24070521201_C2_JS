<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Data | fetch() &amp; $.getJSON()</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Student Records</h1>
      <p class="subtitle">
        Loaded from <code>data/students.json(24070521201)</code> using
        <strong>fetch()</strong> and <strong>$.getJSON()</strong>
      </p>
    </header>

    <section class="controls">
      <button id="btnFetch" class="btn btn-primary">Load with fetch()</button>
      <button id="btnJQuery" class="btn btn-secondary">Load with $.getJSON()</button>
      <button id="btnClear" class="btn btn-ghost">Clear Table</button>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">
      Click a button to load the data…
    </p>

    <div class="table-wrapper">
      <table id="studentTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Course</th>
            <th>Semester</th>
            <th>Marks</th>
            <th>City</th>
            <th>Result</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="7" class="empty">No data loaded yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- jQuery 3.7.1 (CDN) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Custom script -->
  <script src="js/script.js"></script>
</body>
</html>
